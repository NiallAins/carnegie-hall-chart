<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta -->
    <title>
        Carnegie Hall Chart
    </title>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    />

    <!-- Styles -->
    <link
        rel="stylesheet"
        href="./style.css"
    />
</head>

<body>
    <div class="page">
        <div class="contain">
            <div class="sources"></div>
            <div class="freqs"></div>
            <div class="keys"></div>
            <div class="fifths"></div>
            <div class="inters"></div>
            <div class="staff"></div>
            <div class="title">
                <span class="title__heading">The Carnegie Hall Chart</span>
                <span>Based on the 1941 chart by E.J. Quinby</span>
                <span>nialldesign.dev</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <a
            class="button"
            href="./carnegie-hall-chart.png"
            download="./carnegie-hall-chart.png"
        >
            Save image
        </a>
        <button
            class="button controls__zoom"
            onclick="document.body.classList.toggle('zoomed')"
        >
            <span>Full size</span>
            <span>Fit screen</span>
        </button>
    </div>

    <script src="./script.js"></script>
</body>

</html>
